server.port=8080

# Application Name
spring.application.name=edu-management-system

# MySQL Database Configuration (with fallbacks and env support)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edumanage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart / File Upload Settings (up to 50MB for video notes and high-res screenshots)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# JWT Security Configuration
app.jwt.secret=EducationManagementSystemEnterpriseSecretKeyWithAtLeast256BitsLengthForJWTSigning1234567890
app.jwt.expiration-ms=86400000

# Admin UPI Details for Course Payments
app.upi.id=9392199829@axl
app.upi.name=EduManage Academy Official
app.upi.merchant-code=EDUMANAGE2026

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.edumanage=INFO
logging.level.org.springframework.security=WARN
